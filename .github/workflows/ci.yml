name: regression

on:
  push:
  pull_request:

jobs:
  verilator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Toolchain
        run: make toolchain
      - name: Regression
        run: make regression
